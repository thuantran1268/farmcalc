
name: Cap nhat gia GREENFEED mien Bac

on:
  workflow_dispatch:
  schedule:
    - cron: '20 1 * * *'

permissions:
  contents: write

concurrency:
  group: greenfeed-price-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Read and validate GREENFEED market data
        run: python scripts/update_greenfeed.py

      - name: Commit price history if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/greenfeed-north.json

          if git diff --cached --quiet; then
            echo "Khong co du lieu gia moi."
          else
            git commit -m "Update GREENFEED northern prices"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
